name: Devotional header verification
on:
  pull_request:
    branches: [main]
    paths: ['client/src/components/Header.tsx', '.github/workflows/header-verification.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:music-commerce
      - run: npm run test:sharing
