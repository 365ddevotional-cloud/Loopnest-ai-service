name: Ministrium standalone checks
on:
  pull_request:
    paths: ['standalone/ministrium/**', '.github/workflows/ministrium.yml']
  push:
    branches: ['feat/ministryharbor-standalone-20261029']
    paths: ['standalone/ministrium/**', '.github/workflows/ministrium.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: standalone/ministrium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: standalone/ministrium/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm test
