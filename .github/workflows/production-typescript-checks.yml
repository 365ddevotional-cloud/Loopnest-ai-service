name: Production TypeScript and regression verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'server/**'
      - 'shared/**'
      - 'tsconfig.json'
      - '.github/workflows/production-typescript-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify translated forms, privacy values and purchase options
        run: node --import tsx --test client/src/test/*.test.ts
      - name: Verify speech language, paused queues and silent startup recovery
        run: node --import tsx --test client/src/hooks/useAudioReader.test.ts client/src/hooks/useI18n.test.ts
      - name: Verify saved devotional recordings and publication review
        run: node --import tsx --test server/devotional-recordings.test.ts server/devotional-google-voice.test.ts server/content-preparation.test.ts
      - name: Verify private translation drafts and admin-only review
        run: node --import tsx --test server/content-translation-review.test.ts server/approved-content-translations.test.ts
      - run: npm run build
      - run: npm run test:music-commerce
      - run: node --import tsx --test server/ministry-shop-asset-readiness.test.ts
      - run: node --import tsx --test server/spirit-tone-playback-policy.test.ts
      - run: npm run test:sharing
      - name: Install FFmpeg for stereo source verification
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node script/test-ministry-shop-audio-preview.mjs
      - name: Verify complete SpiritTone song packages
        run: python3 script/test-spirit-tone-package.py

