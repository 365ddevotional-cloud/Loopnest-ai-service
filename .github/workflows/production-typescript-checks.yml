name: Production TypeScript and regression verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'client/src/**'
      - 'server/**'
      - 'shared/**'
      - 'tsconfig.json'
      - '.github/workflows/production-typescript-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:music-commerce
      - run: node --import tsx --test server/ministry-shop-asset-readiness.test.ts
      - run: node --import tsx --test server/spirit-tone-playback-policy.test.ts
      - run: npm run test:sharing
      - name: Install FFmpeg for stereo source verification
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify complete SpiritTone song packages
        run: python3 script/test-spirit-tone-package.py
